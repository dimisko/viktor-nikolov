<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="100" height="100" fill="#0a0a0a" rx="4"/>
  
  <!-- Outer border -->
  <rect x="3" y="3" width="94" height="94" fill="none" stroke="#3f3f46" stroke-width="1.5" rx="3"/>
  
  <!-- Magnifying glass circle -->
  <circle cx="65" cy="35" r="18" fill="none" stroke="url(#amberGrad)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Magnifying glass handle -->
  <line x1="78" y1="48" x2="88" y2="58" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#shadow)"/>
  
  <!-- VN Initials in monospace style -->
  <text x="25" y="62" font-family="'Courier New', 'JetBrains Mono', monospace" font-size="28" font-weight="bold" fill="#fbbf24" letter-spacing="-1" text-anchor="middle">BH</text>
  
  <!-- Small decorative line under initials -->
  <line x1="18" y1="68" x2="32" y2="68" stroke="#d97706" stroke-width="1.5"/>
</svg>

